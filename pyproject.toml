[project]
name = "warpdrive"
version = "0.1.0"
description = "Warp bubble notebook: visualizing and testing the author's warp-drive ideas"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Any numpy overflow / invalid-value warning is a bug, not noise.
filterwarnings = ["error"]
